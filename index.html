/* ---------------- SESSION 0 ---------------- */
{id:0,ch:"Level 1: Foundations",title:"Math you need first",time:"45–60 min",sec:"No prior statistics needed",
body:`<p>Everything in Chapters 1–3 uses only school math. Master these six tools and nothing later will feel like a wall.</p>
<div class="levels"><div><b>Level 1: Foundations</b>Sessions 0–3. Language of data and sampling.</div><div><b>Level 2: Probability</b>Sessions 4–7. Reasoning under uncertainty.</div><div><b>Level 3: Distributions</b>Sessions 8–10. Models for numbers.</div><div><b>Level 4: Exam-ready</b>Session 11. Formula sheet and mixed test.</div></div>
<p>Each session follows the same rhythm: <b>intuition</b> first, then <b>concepts</b>, a <b>worked example</b> done step by step, <b>common mistakes</b>, and <b>practice</b> with a hidden answer key. Always attempt practice before opening the key.</p>

<h3>1. Fractions, decimals, percentages</h3>
<p>Probability is written in all three forms: 3/8 = 0.375 = 37.5%. Get comfortable switching.</p>
<ul><li>"4% of 12" means 0.04 × 12 = 0.48.</li>
<li><b>Percentage points vs percent.</b> Going from 10% to 12% is a rise of 2 <i>percentage points</i>, but a 20% <i>relative</i> increase (2/10). News reports mix these up constantly.</li></ul>

<h3>2. Translating words into inequalities</h3>
<p>Exam questions hide the math inside English. For a count Y (whole numbers only):</p>
<div class="tw"><table><tr><th>Words</th><th>Math</th><th>Values included</th></tr>
<tr><td>exactly 2</td><td>Y = 2</td><td>2</td></tr>
<tr><td>at least 2</td><td>Y ≥ 2</td><td>2, 3, 4, …</td></tr>
<tr><td>more than 2</td><td>Y &gt; 2, same as Y ≥ 3</td><td>3, 4, …</td></tr>
<tr><td>at most 2 / no more than 2</td><td>Y ≤ 2</td><td>0, 1, 2</td></tr>
<tr><td>fewer than 2</td><td>Y &lt; 2, same as Y ≤ 1</td><td>0, 1</td></tr>
<tr><td>at least one</td><td>Y ≥ 1 = 1 − P(Y = 0)</td><td>everything except 0</td></tr></table></div>

<h3>3. Set notation</h3>
<p>Let A = "customer buys a laptop", B = "customer buys a mouse".</p>
<ul><li><b>A ∩ B</b> (intersection, "and"): buys both.</li>
<li><b>A ∪ B</b> (union, "or"): buys at least one of them. "Or" in statistics always includes "both".</li>
<li><b>Aᶜ</b> (complement, "not"): does not buy a laptop.</li></ul>
<p>Draw a Venn diagram: two overlapping circles. The overlap is A ∩ B; everything inside either circle is A ∪ B; everything outside A is Aᶜ.</p>

<h3>4. Summation Σ</h3>
<p>Σ is shorthand for "add them all up". Σ x·P(x) means: multiply each value by its probability, then add.</p>
<div class="card worked"><span class="lab">Worked example</span>
Values 0, 1, 2 with probabilities 0.5, 0.3, 0.2.<br>
Σ x·P(x) = 0×0.5 + 1×0.3 + 2×0.2 = 0 + 0.3 + 0.4 = <b>0.7</b></div>

<h3>5. Factorials and combinations</h3>
<ul><li>n! ("n factorial") = n × (n−1) × … × 1. So 5! = 120. By definition 0! = 1.</li>
<li><b>nCr</b> = number of ways to choose r items from n, order not mattering = n! / (r!(n−r)!).</li></ul>
<div class="card worked"><span class="lab">Worked example: why 5C2 = 10</span>
Pick a 2-person team from 5 people A–E. List them: AB, AC, AD, AE, BC, BD, BE, CD, CE, DE. That's 10.<br>
Formula: 5! / (2! × 3!) = 120 / (2 × 6) = 10.<br>
Shortcuts: nC0 = nCn = 1, nC1 = n, nC2 = n(n−1)/2.</div>

<h3>6. Powers and the complement trick</h3>
<p>If each of 5 independent events has a 0.9 chance of going fine, all 5 going fine has probability 0.9⁵ = 0.59049. So "at least one problem" = 1 − 0.59049 = 0.40951.</p>
<p>This "1 − P(none)" trick shows up again and again. Remember it.</p>

<h3>Practice</h3>
<div class="card ex"><ol>
<li>Write 7/20 as a percentage.</li>
<li>A conversion rate moves from 12% to 15%. What is the change in percentage points, and the relative change?</li>
<li>Write "no more than 3 defects" as an inequality.</li>
<li>Compute 6C3.</li>
<li>Values 1, 2, 3 with probabilities 0.2, 0.5, 0.3. Compute Σ x·P(x).</li>
<li>Compute 1 − 0.9⁵.</li>
<li>Compute 12C2.</li>
<li>Compute 0.96¹².</li></ol></div>`,
ans:`<ol><li>35%</li><li>+3 percentage points; relative change 3/12 = +25%</li><li>Y ≤ 3</li><li>6!/(3!3!) = 720/36 = 20</li><li>0.2 + 1.0 + 0.9 = 2.1</li><li>0.40951</li><li>12×11/2 = 66</li><li>≈ 0.613</li></ol>`},

/* ---------------- SESSION 1 ---------------- */
{id:1,ch:"Level 1 · Chapter 1: Foundations & Sampling",title:"The vocabulary of statistics",time:"60–75 min",sec:"Notes §1.1–1.5",
body:`<h3>Intuition: the soup</h3>
<p>You don't drink a whole pot of soup to check the salt. You stir it and taste one spoonful. Statistics is the science of the spoonful.</p>
<ul><li><b>The pot</b> is the <b>target population</b>: everyone you actually care about.</li>
<li><b>The spoonful</b> is the <b>sample</b>: who you actually collect data from.</li>
<li><b>Stirring</b> is <b>random sampling</b>. Without it, your spoon might come from the salty top layer.</li></ul>

<h3>The PPDAC cycle</h3>
<p>Every serious study moves through five stages. Formulas live only in one of them.</p>
<div class="tw"><table><tr><th>Stage</th><th>Question</th><th>AI job-displacement example</th></tr>
<tr><td>Problem</td><td>What exactly do we want to know?</td><td>What % of Indian employees expect AI job loss in 3 years?</td></tr>
<tr><td>Plan</td><td>What to measure, from whom, how?</td><td>Online survey design, who gets it</td></tr>
<tr><td>Data</td><td>Collect, manage, clean</td><td>500 emails, 180 responses</td></tr>
<tr><td>Analysis</td><td>Summaries, patterns</td><td>68% said yes</td></tr>
<tr><td>Conclusion</td><td>Interpret, communicate, new questions</td><td>Can we generalise? Probably not (see below)</td></tr></table></div>

<h3>The three-layer chain</h3>
<pre>Target population  →  Study population  →  Sample
(who you care about)   (who you could reach)   (who actually gave data)</pre>
<p>The middle layer is where most real studies break. If the study population doesn't resemble the target, even a perfectly random sample from it gives the wrong answer.</p>

<h3>Parameter vs statistic</h3>
<p><b>P</b>arameter describes the <b>P</b>opulation and is almost always unknown. <b>S</b>tatistic describes the <b>S</b>ample and is always computable. The whole course is about using a statistic to say something justified about a parameter.</p>
<div class="tw"><table><tr><th>Context</th><th>Parameter (unknown)</th><th>Statistic (computed)</th></tr>
<tr><td>Election</td><td>% of all voters supporting a party</td><td>% in an exit poll of 5,000</td></tr>
<tr><td>Quality control</td><td>Mean weight of all packets made today</td><td>Mean weight of 50 packets checked</td></tr>
<tr><td>HR</td><td>True intent-to-quit rate across all staff</td><td>% of 200 surveyed staff who say they'll quit</td></tr>
<tr><td>Product</td><td>% of all users who would adopt a feature</td><td>% of 300 beta testers who adopted it</td></tr></table></div>
<p>In this course the two main parameters are the <b>population proportion p</b> and the <b>population mean μ</b>.</p>

<h3>Other terms</h3>
<ul><li><b>Subject:</b> one unit you collect data from: a person, firm, branch, state.</li>
<li><b>Variable:</b> a characteristic that varies across subjects (answer, age, role).</li>
<li><b>Sample size n:</b> number of subjects who <i>actually provided data</i>. 500 surveys sent, 180 replies, so n = 180.</li>
<li><b>Dataset:</b> one row per subject, one column per variable.</li>
<li><b>Simple random sample:</b> every unit in the population has an equal chance of selection.</li></ul>

<h3>Level up: types of variables</h3>
<p>This decides which tools you use later.</p>
<div class="tw"><table><tr><th>Type</th><th>Meaning</th><th>Examples</th><th>Typical model later</th></tr>
<tr><td>Categorical</td><td>Labels or groups</td><td>Yes/No, department, company</td><td>Bernoulli, proportions</td></tr>
<tr><td>Quantitative, discrete</td><td>Countable numbers</td><td>Complaints per day, defaults in a portfolio</td><td>Binomial</td></tr>
<tr><td>Quantitative, continuous</td><td>Any value in a range</td><td>Delivery time, revenue, age</td><td>Normal</td></tr></table></div>

<div class="card idea"><span class="lab">Why a big biased sample loses to a small random one</span>
In 1936 the Literary Digest magazine polled about 2.4 million people, drawn largely from car registrations and telephone listings, and predicted Alf Landon would beat Franklin Roosevelt. Roosevelt won in a landslide. George Gallup, using a far smaller but better-selected sample, called it correctly. Car and phone owners in 1936 were wealthier than the average voter: the study population didn't match the target. Size cannot fix that.</div>

<h3>Common mistakes</h3>
<div class="card warn"><ul><li>Using surveys <i>sent</i> as n instead of responses received.</li>
<li>Calling a sample statistic "the population value".</li>
<li>Thinking a larger sample fixes a biased design. It only makes you more confidently wrong.</li>
<li>Treating a census (every unit measured) as a sample: a census gives the parameter directly.</li></ul></div>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Exercise 1: the notes' AI survey</span>Fill in every blank in §1.4: target population, study population, sample, sample size, subject, parameter, statistic.</div>
<div class="card ex"><span class="lab">Exercise 2</span>A software firm emails 400 randomly chosen companies from its own customer list to learn what share of <i>all mid-size Indian manufacturers</i> would pay for an AI demand-forecasting tool. 150 reply; 42% say yes. Identify target population, study population, sample and n, parameter, statistic, and one reason 42% may mislead.</div>
<div class="card ex"><span class="lab">Exercise 3: parameter or statistic?</span><ol>
<li>A survey of 1,000 Bengaluru commuters finds the average commute is 52 minutes.</li>
<li>HR records for all 2,400 employees show 18% work fully remote.</li>
<li>Of 60 bulbs tested from a batch, 3 failed.</li></ol></div>
<div class="card check"><span class="lab">Checkpoint</span>Give two reasons the 68% figure can't be generalised to all Indian employees.</div>`,
ans:`<h4>Exercise 1</h4><ul><li>Target: all Indian employees across all sectors and company types</li><li>Study population: employees of the top 10 Indian IT companies</li><li>Sample: the 180 respondents; n = 180</li><li>Subject: each responding employee</li><li>Parameter: true proportion of all Indian employees who believe AI-driven displacement is imminent</li><li>Statistic: 0.68</li></ul>
<h4>Exercise 2</h4><ul><li>Target: all mid-size manufacturing companies in India</li><li>Study population: mid-size manufacturers on this firm's customer list</li><li>Sample: the 150 responding companies; n = 150</li><li>Parameter: true share of all mid-size Indian manufacturers who would pay</li><li>Statistic: 0.42</li><li>Misleading because existing customers already trust the vendor (study ≠ target), and 250 of 400 didn't reply (non-response bias)</li></ul>
<h4>Exercise 3</h4><ol><li>52 minutes is a statistic; the parameter is the mean commute of all Bengaluru commuters.</li><li>18% is a parameter: the whole population was measured (a census).</li><li>3/60 = 5% is a statistic estimating the batch failure rate.</li></ol>
<h4>Checkpoint</h4><p>(1) The study population is IT-only and top-firm-only, so it doesn't represent all Indian employees. (2) Only 36% responded, and anxious employees may be over-represented (non-response bias).</p>`},

/* ---------------- SESSION 2 ---------------- */
{id:2,ch:"Level 1 · Chapter 1: Foundations & Sampling",title:"Sampling designs",time:"60–75 min",sec:"Notes §1.6–1.8",
body:`<h3>Intuition</h3>
<p>A sample should be a <b>mini-population</b>: every important group in the population should show up in roughly the right proportions. The <b>sampling design</b> is the mechanism that makes that happen.</p>

<h3>Sampling frame</h3>
<p>The complete list of population units you can draw from. For Pinnacle Group it's the list of all 60,000 employees, E1 to E60000. If the frame misses people, they can never be sampled: that's under-coverage.</p>

<h3>Simple random sampling (SRS)</h3>
<p><b>Every possible sample of size n is equally likely.</b> Two flavours: with replacement (a unit can be picked twice) and without replacement (at most once). Unless stated otherwise, SRS means without replacement.</p>
<div class="card worked"><span class="lab">Worked example: mapping random numbers to employees</span>
Number the frame in blocks: IT Services 1–15,000; Manufacturing 15,001–27,000; Financial Services 27,001–35,000; and so on.
<div class="step">Random number 3,720 falls in 1–15,000, so it's IT Services employee #3,720.</div>
<div class="step">15,800 falls in Manufacturing: 15,800 − 15,000 = employee #800.</div>
<div class="step">28,500 falls in Financial Services: 28,500 − 27,000 = employee #1,500.</div>
Generate 100 unique random numbers this way and you have an SRS of 100.</div>
<p><b>The weakness of SRS:</b> by pure chance, a small group (say Healthcare, 7,000 of 60,000) might get only 5 people, or 20. SRS guarantees fairness, not balance.</p>

<h3>Cluster vs stratified: the most-tested distinction</h3>
<div class="tw"><table><tr><th></th><th>Within-group variation</th><th>Between-group variation</th><th>What you do</th><th>Why</th></tr>
<tr><td><b>Cluster</b></td><td>High: each group is a mini-population</td><td>Low: groups look alike</td><td>Randomly pick <i>some</i> groups; survey everyone (or a random subset) inside</td><td>Cheap. You only travel to a few places.</td></tr>
<tr><td><b>Stratified</b></td><td>Low: members are similar</td><td>High: groups differ</td><td>Randomly sample from <i>every</i> group</td><td>Guarantees each distinct group is represented</td></tr></table></div>
<p>Memory aid: <b>clusters are copies</b> of the population; <b>strata are slices</b> of it. With copies, a few are enough. With slices, you need every slice.</p>

<h4>More examples</h4>
<div class="tw"><table><tr><th>Situation</th><th>Groups</th><th>Design</th></tr>
<tr><td>AI tool usage in a bank with 200 similar branches</td><td>Branches (each has tellers, RMs, managers)</td><td>Cluster</td></tr>
<tr><td>Staff satisfaction in a franchise with near-identical outlets</td><td>Outlets</td><td>Cluster</td></tr>
<tr><td>Pinnacle's AI CoE</td><td>Verticals with distinct expertise</td><td>Stratified</td></tr>
<tr><td>SaaS customer survey</td><td>Enterprise / mid-market / SMB tiers</td><td>Stratified</td></tr>
<tr><td>National household survey</td><td>States × urban/rural, then villages/blocks</td><td>Multi-stage (both)</td></tr></table></div>

<h3>Proportional allocation</h3>
<p>How many from each stratum? Give each stratum its population share:</p>
<pre>nₕ = n × (Nₕ / N)</pre>
<div class="card worked"><span class="lab">Worked example: SaaS customer survey</span>
Customers: Enterprise 2,000; Mid-market 6,000; SMB 12,000. N = 20,000. Budget n = 200.
<div class="step">Enterprise: 200 × 2,000/20,000 = 200 × 0.10 = <b>20</b></div>
<div class="step">Mid-market: 200 × 0.30 = <b>60</b></div>
<div class="step">SMB: 200 × 0.60 = <b>120</b></div>
Check: 20 + 60 + 120 = 200. Then draw an SRS of the given size inside each tier.</div>
<p><b>Rounding rule:</b> when allocations aren't whole numbers, round them, then adjust so they add back to exactly n (give the extra unit to the stratum with the largest decimal part).</p>

<div class="card idea"><span class="lab">Level up: disproportionate allocation</span>
Sometimes you deliberately over-sample a small stratum (e.g. 50 Enterprise instead of 20) because you need reliable results for that group on its own. You then reweight when combining results. Proportional allocation is the default; disproportionate is a conscious choice.</div>

<h3>Common mistakes</h3>
<div class="card warn"><ul><li>Choosing cluster sampling when groups differ from each other (you'd miss whole types of people).</li>
<li>Thinking stratified means "take whoever is convenient from each group". Selection <i>within</i> each stratum must still be random.</li>
<li>Allocations that don't add up to n after rounding.</li></ul></div>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Exercise 1</span>Compute the AI CoE allocation (n = 100). Strengths: IT 15,000; Manufacturing 12,000; Financial Services 8,000; Consumer Products 10,000; Healthcare 7,000; Energy 8,000; N = 60,000.</div>
<div class="card ex"><span class="lab">Exercise 2: name the design</span><ol>
<li>Randomly pick 10 of 200 near-identical franchise outlets and survey all staff in them.</li>
<li>Survey a random 5% of employees in each job grade.</li>
<li>Draw random numbers from the full employee list.</li>
<li>Randomly pick 3 of 20 cities, then survey 100 random households in each.</li>
<li>A hospital samples doctors, nurses and admin staff in proportion to headcount.</li></ol></div>
<div class="card check"><span class="lab">Checkpoint</span>Bank branches vs AI CoE verticals: which design fits each, and why?</div>`,
ans:`<h4>Exercise 1</h4><div class="tw"><table><tr><th>Vertical</th><th>Exact</th><th>Rounded</th></tr><tr><td>IT Services</td><td>25.00</td><td>25</td></tr><tr><td>Manufacturing</td><td>20.00</td><td>20</td></tr><tr><td>Financial Services</td><td>13.33</td><td>13</td></tr><tr><td>Consumer Products</td><td>16.67</td><td>17</td></tr><tr><td>Healthcare</td><td>11.67</td><td>12</td></tr><tr><td>Energy</td><td>13.33</td><td>13</td></tr><tr><td><b>Total</b></td><td>100</td><td>100</td></tr></table></div>
<h4>Exercise 2</h4><ol><li>Cluster</li><li>Stratified</li><li>Simple random sampling</li><li>Multi-stage (clusters, then SRS within)</li><li>Stratified with proportional allocation</li></ol>
<h4>Checkpoint</h4><p>Branches are similar to each other and diverse inside: cluster. Verticals are homogeneous inside and differ from each other: stratified.</p>`},

/* ---------------- SESSION 3 ---------------- */
{id:3,ch:"Level 1 · Chapter 1: Foundations & Sampling",title:"Biases and multi-stage sampling",time:"60–75 min",sec:"Notes §1.9–1.10",
body:`<h3>Intuition</h3>
<p>A biased sample systematically favours some part of the population, so its estimates lean consistently too high or too low. Bias doesn't shrink as the sample grows. It's a design problem, not a size problem.</p>

<h3>The three biases in the notes</h3>
<div class="tw"><table><tr><th>Bias</th><th>Where it goes wrong</th><th>Example</th><th>Fix</th></tr>
<tr><td><b>Sampling bias</b> (incl. under-coverage)</td><td>Who gets <i>selected</i></td><td>CSO and CDO pick only volunteers from their own two verticals</td><td>Random selection from a complete frame</td></tr>
<tr><td><b>Non-response bias</b></td><td>Who <i>answers</i></td><td>180 of 500 reply; anxious employees more likely to respond</td><td>Follow-ups, incentives, confidentiality, short surveys</td></tr>
<tr><td><b>Response bias</b></td><td>What they <i>say</i></td><td>Loaded wording; Ryanair's all-positive rating scale</td><td>Neutral wording, balanced scales, anonymity</td></tr></table></div>

<h4>Sampling bias in more settings</h4>
<ul><li>Estimating UPI use among all Indian adults by surveying a fintech conference.</li>
<li>Estimating customer satisfaction from app-store reviews: people with strong feelings self-select (<b>voluntary response</b>).</li>
<li>Training an AI hiring model only on past hires: it never sees the people who were rejected.</li></ul>

<h4>Response bias in more settings</h4>
<ul><li><b>Social desirability:</b> asked "How many hours do you study each week?", people over-report.</li>
<li><b>Authority presence:</b> asking employees about job satisfaction with their manager in the room.</li>
<li><b>Leading question:</b> "Don't you agree our excellent new app is easy to use?"</li>
<li><b>Double-barrelled:</b> "How satisfied are you with our pricing and support?" (two things, one answer)</li>
<li><b>Ordering effect:</b> asking about recent layoffs just before asking about job security.</li></ul>

<div class="card idea"><span class="lab">Level up: survivorship bias</span>
In World War II, analysts studied bullet holes on returning bombers and proposed armouring the most-hit areas. Statistician Abraham Wald pointed out the flaw: they only saw planes that <i>survived</i>. The areas with no holes on returning planes were where hits were fatal, so those needed armour. Business version: studying only successful startups to learn "what works" ignores the many that did the same things and failed.</div>

<h3>Multi-stage sampling</h3>
<p>Big real surveys combine designs. The Myanmar Demographic and Health Survey (2015–16):</p>
<ol><li><b>Stratify:</b> 15 states/regions × urban/rural = 30 strata.</li>
<li><b>Cluster:</b> randomly select geographic blocks within each stratum using proportional allocation: 442 clusters (123 urban, 319 rural). Yangon, mostly urban, got 21 urban and 12 rural.</li>
<li><b>SRS:</b> 30 households from each cluster, 442 × 30 = 13,260 households.</li></ol>
<p>Stratification guarantees every region and setting appears; clustering keeps field costs sane.</p>

<h3>Common mistakes</h3>
<div class="card warn"><ul><li>Confusing non-response (people didn't answer) with response bias (people answered, but distortedly).</li>
<li>Assuming a high response count cures a biased selection.</li>
<li>Forgetting that "voluntary" and "convenience" samples are both forms of sampling bias.</li></ul></div>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Exercise 1: name the bias</span><ol>
<li>App-store reviews used to estimate overall satisfaction.</li>
<li>Employees asked face-to-face, with their manager present, whether they are happy at work.</li>
<li>A survey emailed to 2,000 customers gets 150 replies.</li>
<li>A bank surveys elderly customers only through its mobile app.</li>
<li>"Do you support the new policy, which experts say will save lives?"</li>
<li>Studying only unicorn startups to find the habits of successful founders.</li></ol></div>
<div class="card ex"><span class="lab">Exercise 2: rewrite neutrally</span><ol>
<li>"Don't you agree that our excellent new app is easy to use?"</li>
<li>"How satisfied are you with our pricing and support?"</li></ol></div>
<div class="card ex"><span class="lab">Exercise 3</span>For each of the three main biases, write one example from your own work.</div>
<div class="card check"><span class="lab">Checkpoint</span>Classify the §1.6 schemes: (1) fintech-conference attendees for UPI usage, (2) users with 5+ support contacts for chatbot satisfaction, (3) one large IT company for job-displacement fear.</div>`,
ans:`<h4>Exercise 1</h4><ol><li>Sampling bias (voluntary response / self-selection)</li><li>Response bias (social desirability, authority present)</li><li>Non-response bias risk (7.5% response rate)</li><li>Sampling bias: under-coverage of customers who don't use the app</li><li>Response bias: leading wording</li><li>Survivorship bias, a form of sampling bias</li></ol>
<h4>Exercise 2</h4><ol><li>"How easy or difficult is the new app to use?" with a balanced scale from very difficult to very easy.</li><li>Split it: one question on pricing, one on support.</li></ol>
<h4>Checkpoint</h4><p>All three are sampling bias (convenience / under-coverage). Each excludes most of the target population: non-attendees, typical users, and other companies and sectors respectively.</p>`},

/* ---------------- SESSION 4 ---------------- */
{id:4,ch:"Level 2 · Chapter 2: Probability",title:"What probability means, and events",time:"60–75 min",sec:"Notes §2.1–2.3",
body:`<h3>Intuition</h3>
<p>Probability is a number from 0 (impossible) to 1 (certain) that expresses how likely something is. It doesn't remove uncertainty; it lets you <i>reason</i> about it and compare options.</p>

<h3>Three sources of a probability</h3>
<div class="tw"><table><tr><th>Type</th><th>Where the number comes from</th><th>Example</th></tr>
<tr><td>Frequentist</td><td>Long-run relative frequency in repeatable situations</td><td>4.5% of past comparable loans defaulted, so P(default) ≈ 0.045</td></tr>
<tr><td>Subjective</td><td>Reasoned belief from evidence and judgment</td><td>"30% chance a competitor enters next year"; Hubinger's personal estimate of AI risk</td></tr>
<tr><td>Model-based</td><td>Output of a model given inputs</td><td>An LLM's probability for the next token</td></tr></table></div>
<p>Always ask: <b>where did this number come from?</b></p>

<h4>The law of large numbers, informally</h4>
<p>Toss a fair coin 10 times and 8 heads is unremarkable. Toss it 10,000 times and the share of heads will be very close to 50%. Individual outcomes are unpredictable; long-run frequencies are stable.</p>

<h3>Sample spaces and events</h3>
<ul><li><b>Sample space S:</b> all possible outcomes. Rolling a die: S = {1, 2, 3, 4, 5, 6}.</li>
<li><b>Event:</b> any subset. "Even number" = {2, 4, 6}.</li>
<li>Rules: 0 ≤ P(A) ≤ 1 and P(S) = 1.</li>
<li><b>Equally likely rule:</b> P(A) = (outcomes in A) / (total outcomes). Only valid when every outcome is equally likely. A product being above / on / below target is <i>not</i> three equally likely outcomes.</li></ul>

<div class="card worked"><span class="lab">Worked example: two dice</span>
Roll two dice. S has 6 × 6 = 36 equally likely pairs.
<div class="step">Sum = 7: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1), 6 outcomes. P = 6/36 = 1/6.</div>
<div class="step">Sum ≥ 11: (5,6),(6,5),(6,6), 3 outcomes. P = 3/36 = 1/12.</div></div>

<h3>The four operations</h3>
<div class="tw"><table><tr><th>Operation</th><th>Words</th><th>Rule</th></tr>
<tr><td>Complement Aᶜ</td><td>not A</td><td>P(Aᶜ) = 1 − P(A)</td></tr>
<tr><td>Intersection A ∩ B</td><td>A and B</td><td>overlap of the circles</td></tr>
<tr><td>Union A ∪ B</td><td>A or B (or both)</td><td>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</td></tr>
<tr><td>Mutually exclusive</td><td>can't both happen</td><td>P(A ∩ B) = 0, so P(A ∪ B) = P(A) + P(B)</td></tr></table></div>
<p><b>Why subtract the overlap?</b> When you add P(A) and P(B), cases that are in both get counted twice.</p>

<div class="card worked"><span class="lab">Worked example: a deck of cards</span>
P(heart or king) from a 52-card deck.
<div class="step">P(heart) = 13/52; P(king) = 4/52; P(king of hearts) = 1/52.</div>
<div class="step">P(heart ∪ king) = 13/52 + 4/52 − 1/52 = 16/52 ≈ <b>0.308</b></div>
Without subtracting, you'd get 17/52 and count the king of hearts twice.</div>

<div class="card worked"><span class="lab">Worked example: "neither" and "only"</span>
60% of customers use UPI, 45% use cards, 30% use both.
<div class="step">Either: 0.60 + 0.45 − 0.30 = 0.75</div>
<div class="step">Neither: 1 − 0.75 = 0.25</div>
<div class="step">UPI only: 0.60 − 0.30 = 0.30. Cards only: 0.45 − 0.30 = 0.15.</div>
Check: 0.30 + 0.15 + 0.30 + 0.25 = 1. The four Venn regions always add to 1.</div>

<h3>Common mistakes</h3>
<div class="card warn"><ul><li>Adding probabilities of overlapping events without subtracting the overlap.</li>
<li>Reading "or" as "one but not both".</li>
<li>Using the equally-likely formula when outcomes differ in likelihood.</li>
<li>Assuming mutually exclusive means independent. It's almost the opposite (Session 6).</li></ul></div>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Exercise 1: project delivery risk (notes §2.3.2)</span>100 projects: 35 over budget (B), 28 late (L), 15 both. (a) P(B), P(L), P(B∩L). (b) P(B ∪ L). (c) P(neither). (d) Mutually exclusive? (e) A manager says 35% + 28% = 63% had a problem. What's wrong? Draw the Venn diagram first.</div>
<div class="card ex"><span class="lab">Exercise 2</span><ol>
<li>Roll a die. P(even or greater than 4)?</li>
<li>P(at least one six in 4 rolls of a die)? Use the complement trick.</li>
<li>The notes' blanks: die sample space and "even" event; product sample space and "meets or exceeds target" event; P(Aᶜ) if P(on-time) = 0.8.</li></ol></div>`,
ans:`<h4>Exercise 1</h4><ul><li>(a) 0.35, 0.28, 0.15</li><li>(b) 0.35 + 0.28 − 0.15 = <b>0.48</b></li><li>(c) 1 − 0.48 = <b>0.52</b></li><li>(d) No: 15 projects are both</li><li>(e) The 15% overlap was counted twice; the correct figure is 48%</li></ul>
<h4>Exercise 2</h4><ol><li>{2, 4, 6} ∪ {5, 6} = {2, 4, 5, 6}, so 4/6 ≈ 0.667</li><li>1 − (5/6)⁴ = 1 − 0.482 ≈ <b>0.518</b></li><li>S = {1,…,6}, A = {2, 4, 6}. S = {above, on, below}; event = {above, on}. P(Aᶜ) = 0.2.</li></ol>`},

/* ---------------- SESSION 5 ---------------- */
{id:5,ch:"Level 2 · Chapter 2: Probability",title:"Conditional probability",time:"75 min",sec:"Notes §2.4.1–2.4.2",
body:`<h3>Intuition: zoom in</h3>
<p>Conditioning means "given what we now know, look only at the relevant subgroup". The bank learns the applicant has a poor credit history, so it no longer looks at all applicants, only at applicants <i>like this one</i>.</p>
<pre>P(A | B) = P(A ∩ B) / P(B)       read as "probability of A given B"</pre>
<p>The formula just changes the denominator from "everyone" to "only those in B".</p>

<h3>The contingency-table method</h3>
<p>Most exam questions come as a two-way table. Every conditional probability is <b>one cell divided by one row total or one column total</b>. The only question is which total.</p>
<div class="card worked"><span class="lab">Worked example: subscription churn</span>
<div class="tw"><table><tr><th>Plan</th><th>Churned</th><th>Stayed</th><th>Total</th></tr>
<tr><td>Premium</td><td>30</td><td>270</td><td>300</td></tr>
<tr><td>Basic</td><td>140</td><td>560</td><td>700</td></tr>
<tr><td>Total</td><td>170</td><td>830</td><td>1,000</td></tr></table></div>
<div class="step">P(churn) = 170/1,000 = <b>0.17</b> (grand total denominator)</div>
<div class="step">P(churn | Premium) = 30/300 = <b>0.10</b> (Premium row total)</div>
<div class="step">P(churn | Basic) = 140/700 = <b>0.20</b> (Basic row total)</div>
<div class="step">P(Premium | churn) = 30/170 ≈ <b>0.176</b> (Churned column total)</div>
Read the "given" part: it tells you which total goes in the denominator.</div>

<h3>P(A | B) ≠ P(B | A)</h3>
<p>These answer different questions because they use different reference groups.</p>
<ul><li>P(churn | Premium) = 0.10: of Premium users, 10% churn.</li>
<li>P(Premium | churn) = 0.176: of churners, 17.6% were Premium.</li></ul>
<p>Mixing these up is called the <b>prosecutor's fallacy</b>: "If he were innocent, this evidence would be very unlikely, so he's probably guilty" confuses P(evidence | innocent) with P(innocent | evidence). Bayes (Session 7) is how you convert one into the other properly.</p>

<h3>Rate vs share</h3>
<p>In the ITR table, the highest-income bracket has the highest <i>audit rate</i>, yet a different bracket contributes the largest <i>share</i> of audits because it's much bigger. A group can be risky per member yet small, or safe per member yet large. Both views matter for different decisions: rates for "how risky is this group?", shares for "where is most of the workload?"</p>

<div class="card idea"><span class="lab">Level up: Simpson's paradox</span>
A trend in the combined data can reverse when you split it into subgroups. A hospital can have a higher overall death rate than another yet a lower rate in every severity category, simply because it treats far more severe cases. Lesson: always check whether a hidden grouping variable is driving an aggregate comparison.</div>

<h3>Common mistakes</h3>
<div class="card warn"><ul><li>Using the grand total as the denominator for a conditional probability.</li>
<li>Swapping P(A | B) and P(B | A).</li>
<li>Reading a conditional pattern as proof of cause. Observational data can reflect who was targeted.</li></ul></div>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Exercise 1: reverse the conditioning (project data)</span>Of 28 late projects, 15 were over budget; 35 were over budget in total. Find P(B | L) and P(L | B). Same or different? Why?</div>
<div class="card ex"><span class="lab">Exercise 2: marketing campaign</span>
<div class="tw"><table><tr><th></th><th>Purchased</th><th>Didn't</th><th>Total</th></tr><tr><td>Saw ad</td><td>60</td><td>340</td><td>400</td></tr><tr><td>Didn't see ad</td><td>45</td><td>555</td><td>600</td></tr><tr><td>Total</td><td>105</td><td>895</td><td>1,000</td></tr></table></div>
Find P(purchase), P(purchase | ad), P(purchase | no ad), P(ad | purchase). Does this prove the ad causes purchases?</div>
<div class="card ex"><span class="lab">Exercise 3: ITR audit table (80,200 returns)</span>
<div class="tw"><table><tr><th>Income</th><th>Audited</th><th>Not</th><th>Total</th></tr><tr><td>Under ₹15L</td><td>10</td><td>14,090</td><td>14,100</td></tr><tr><td>₹15–20L</td><td>71</td><td>30,629</td><td>30,700</td></tr><tr><td>₹20–25L</td><td>89</td><td>24,611</td><td>24,700</td></tr><tr><td>₹25L+</td><td>80</td><td>10,620</td><td>10,700</td></tr><tr><td>Total</td><td>250</td><td>79,950</td><td>80,200</td></tr></table></div>
(a) P(audited). (b) Audit rate per bracket; pattern? (c) P(audit | ₹25L+). (d) P(₹25L+ | audit). (e) Why (c) ≠ (d)? (f) Which bracket contributes the largest share of audits? Is it the highest-rate bracket?</div>`,
ans:`<h4>Exercise 1</h4><p>P(B | L) = 15/28 ≈ <b>0.536</b>; P(L | B) = 15/35 ≈ <b>0.429</b>. Different reference groups (late projects vs over-budget projects).</p>
<h4>Exercise 2</h4><ul><li>P(purchase) = 105/1,000 = 0.105</li><li>P(purchase | ad) = 60/400 = 0.15</li><li>P(purchase | no ad) = 45/600 = 0.075</li><li>P(ad | purchase) = 60/105 ≈ 0.571</li><li>No. The ad may have been shown to people already more likely to buy. Causation needs a randomised test.</li></ul>
<h4>Exercise 3</h4><ul><li>(a) 250/80,200 ≈ 0.0031</li><li>(b) 0.0007, 0.0023, 0.0036, 0.0075: rate rises with income</li><li>(c) 80/10,700 ≈ 0.0075</li><li>(d) 80/250 = <b>0.32</b></li><li>(e) Different denominators: all ₹25L+ returns vs all audited returns</li><li>(f) ₹20–25L (89/250 = 35.6%), not the highest-rate bracket. Group size matters.</li></ul>`},

/* ---------------- SESSION 6 ---------------- */
{id:6,ch:"Level 2 · Chapter 2: Probability",title:"Multiplication rule and independence",time:"60–75 min",sec:"Notes §2.4.3–2.4.5",
body:`<h3>The multiplication rule</h3>
<p>Rearranging the conditional formula:</p>
<pre>P(A ∩ B) = P(A | B) × P(B) = P(B | A) × P(A)</pre>
<p>Use it when a joint event is easier to think of as a sequence: first this happens, then given that, the next thing happens.</p>
<div class="card worked"><span class="lab">Worked example: drawing without replacement</span>
A box of 10 parts has 2 defective. Draw 2 without replacement. P(both defective)?
<div class="step">P(1st defective) = 2/10</div>
<div class="step">P(2nd defective | 1st defective) = 1/9 (one defective left among 9)</div>
<div class="step">P(both) = 2/10 × 1/9 = 2/90 ≈ <b>0.022</b></div>
With replacement, the second draw is unaffected: 0.2 × 0.2 = 0.04.</div>

<h3>Independence</h3>
<p>A and B are <b>independent</b> if learning that one happened doesn't change the probability of the other:</p>
<pre>P(A | B) = P(A)     equivalently     P(A ∩ B) = P(A) × P(B)</pre>
<div class="card worked"><span class="lab">Worked example: checking independence in a table</span>
Churn table from Session 5: P(churn) = 0.17 but P(churn | Premium) = 0.10. Knowing the plan changes the churn probability, so churn and plan are <b>not independent</b>.</div>
<div class="card worked"><span class="lab">Worked example: redundant servers</span>
Three servers, each up with probability 0.99, failing independently.
<div class="step">All three up: 0.99³ ≈ 0.970</div>
<div class="step">At least one up: 1 − P(all down) = 1 − 0.01³ = 0.999999</div>
Redundancy is powerful only if failures are truly independent. If all three sit in the same data centre and share a power supply, they are not.</div>

<h3>Mutually exclusive vs independent</h3>
<div class="tw"><table><tr><th></th><th>Mutually exclusive</th><th>Independent</th></tr>
<tr><td>Meaning</td><td>Can't happen together</td><td>One tells you nothing about the other</td></tr>
<tr><td>Formula</td><td>P(A ∩ B) = 0</td><td>P(A ∩ B) = P(A)P(B)</td></tr>
<tr><td>Example</td><td>One delivery is on-time vs late</td><td>Two coin tosses</td></tr></table></div>
<p>If A and B are mutually exclusive and both have positive probability, they are <b>dependent</b>: knowing A happened tells you B definitely didn't.</p>

<h3>Independence is an assumption about the world</h3>
<p>Events that look separate can share a common cause. Two suppliers shipping through the same port will both be late when the port is congested. Two LLM claims built on the same faulty premise will both be wrong. Treat independence as something to justify, not a default.</p>

<h3>Three or more events</h3>
<p>A, B, C are <b>mutually independent</b> only if every pair satisfies the product rule <i>and</i> P(A ∩ B ∩ C) = P(A)P(B)P(C). Pairwise independence alone is not enough, as the ticket-box example shows.</p>

<h3>Chains of conditional risk</h3>
<pre>P(A ∩ B ∩ C) = P(A) × P(B | A) × P(C | A ∩ B)</pre>
<p>This chain rule needs no independence assumption. It is the right way to analyse multi-stage risks such as the notes' recursive-AI example.</p>

<h3>Common mistakes</h3>
<div class="card warn"><ul><li>Multiplying probabilities without checking independence.</li>
<li>Believing mutually exclusive events are independent.</li>
<li>Stopping at pairwise checks for three events.</li></ul></div>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Exercise 1</span>A supplier misses dispatch with probability 0.10. Given a miss, production is disrupted with probability 0.40. P(both)?</div>
<div class="card ex"><span class="lab">Exercise 2</span>Does the ITR table support independence of income and audit status?</div>
<div class="card ex"><span class="lab">Exercise 3: ticket box</span>8 tickets: two each labelled 111, 100, 010, 001. A, B, C = first, second, third digit is 1. List all 8 tickets and find P(A), P(B), P(C), each pairwise intersection, and P(A ∩ B ∩ C). Pairwise independent? Mutually independent?</div>
<div class="card ex"><span class="lab">Exercise 4: recursive AI chain</span>P(A) = 0.60, P(B | A) = 0.50, P(C | A ∩ B) = 0.40. (a) P(full chain). (b) New value if P(C | A ∩ B) falls to 0.10. (c) Does (a) need independence? (d) What extra information would you need to choose which stage to reduce?</div>
<div class="card ex"><span class="lab">Exercise 5: quick ones</span><ol>
<li>A and B independent, P(A) = 0.3, P(B) = 0.5. Find P(A ∩ B) and P(A ∪ B).</li>
<li>A deal needs three independent approvals, each granted with probability 0.9. P(all granted)?</li>
<li>Three independent backup generators each start with probability 0.8. P(at least one starts)?</li></ol></div>`,
ans:`<ul><li><b>1:</b> 0.10 × 0.40 = <b>0.04</b></li>
<li><b>2:</b> No. Audit rates differ across brackets (0.0007 to 0.0075), while independence would make them equal.</li>
<li><b>3:</b> Tickets: 111, 111, 100, 100, 010, 010, 001, 001. P(A) = P(B) = P(C) = 4/8 = ½. Each pairwise intersection is only the 111 tickets: 2/8 = ¼ = ½ × ½, so pairwise independent. But P(A ∩ B ∩ C) = ¼ ≠ ⅛, so <b>not mutually independent</b>.</li>
<li><b>4:</b> (a) 0.6 × 0.5 × 0.4 = <b>0.12</b> (b) 0.6 × 0.5 × 0.1 = <b>0.03</b> (c) No; the chain rule uses conditional probabilities (d) Cost and feasibility of intervening at each stage, how much each probability can be reduced, and side effects.</li>
<li><b>5:</b> (1) 0.15 and 0.3 + 0.5 − 0.15 = 0.65 (2) 0.9³ = 0.729 (3) 1 − 0.2³ = 0.992</li></ul>`},

/* ---------------- SESSION 7 ---------------- */
{id:7,ch:"Level 2 · Chapter 2: Probability",title:"Bayes' theorem",time:"75–90 min",sec:"Notes §2.5–2.6",
body:`<h3>Intuition</h3>
<p>You usually know how likely the <i>evidence</i> is given the truth (a test detects 95% of cases). You want the reverse: how likely the <i>truth</i> is given the evidence (this person tested positive; do they have it?). Bayes' theorem flips the conditioning.</p>
<pre>prior belief  +  new evidence  →  updated (posterior) belief</pre>

<h3>The formula</h3>
<pre>P(B | A) =            P(A | B) × P(B)
           ─────────────────────────────────────
           P(A | B) × P(B)  +  P(A | Bᶜ) × P(Bᶜ)</pre>
<ul><li><b>Prior</b> P(B): belief before the evidence (base rate).</li>
<li><b>Likelihood</b> P(A | B): how likely the evidence is if B is true.</li>
<li><b>Posterior</b> P(B | A): belief after the evidence.</li>
<li>The denominator is just P(A), the total chance of seeing the evidence, from true and false alarms combined.</li></ul>

<h3>The method that never fails: imagine 100,000 cases</h3>
<p>Turn every probability into a count of people. It is slower to write but almost impossible to get wrong.</p>
<div class="card worked"><span class="lab">Worked example: spam filter</span>
20% of emails are spam. The word "offer" appears in 40% of spam and 5% of genuine emails. An email contains "offer". P(spam)?
<div class="step">Imagine 1,000 emails: 200 spam, 800 genuine.</div>
<div class="step">Spam with "offer": 200 × 0.40 = 80.</div>
<div class="step">Genuine with "offer": 800 × 0.05 = 40.</div>
<div class="step">P(spam | "offer") = 80 / (80 + 40) = <b>0.667</b></div>
Formula check: 0.08 / (0.08 + 0.04) = 0.667.</div>

<div class="card worked"><span class="lab">Worked example: tree diagram</span>
<pre>                 ┌─ "offer" 0.40 → 0.20 × 0.40 = 0.08  ✓
     Spam 0.20 ──┤
                 └─ no     0.60 → 0.12
                 ┌─ "offer" 0.05 → 0.80 × 0.05 = 0.04  ✓
  Genuine 0.80 ──┤
                 └─ no     0.95 → 0.76</pre>
Posterior = (branch you want) / (all branches ending in the evidence) = 0.08 / (0.08 + 0.04).</div>

<h3>Why rare conditions fool us</h3>
<p>When the base rate is tiny, even a small false-positive rate applied to the huge healthy group produces more false alarms than true hits. That's why a positive screening test for a rare disease usually means "probably not, but check further".</p>

<div class="card idea"><span class="lab">Level up: the odds form</span>
Posterior odds = prior odds × likelihood ratio, where the likelihood ratio = P(evidence | B) / P(evidence | Bᶜ).<br>
DMD: prior odds = 0.001/0.999 ≈ 1/999. Likelihood ratio = 0.95/0.01 = 95. Posterior odds = 95/999 ≈ 0.095, so probability = 0.095/1.095 ≈ 0.087. Same answer, and it shows each piece of evidence as a multiplier.</div>

<div class="calc" data-calc="bayes"></div>

<h3>Sequential updating</h3>
<p>Today's posterior becomes tomorrow's prior. After a second independent positive test, feed the first posterior back in as the new prior. This is valid only if the tests are <b>conditionally independent</b> given the true state. Repeating the same flawed lab process doesn't give independent evidence.</p>

<h3>Common mistakes</h3>
<div class="card warn"><ul><li>Reporting the test's sensitivity (P(+ | D)) as the answer to P(D | +).</li>
<li>Ignoring the base rate.</li>
<li>Forgetting the false-positive branch in the denominator.</li>
<li>Treating the posterior as a decision. It is an input; costs of each error decide the action.</li></ul></div>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Exercise 1: DMD test (notes §2.5.2)</span>P(D) = 0.001, P(+ | D) = 0.95, P(+ | Dᶜ) = 0.01. Find P(D | +) by formula and by the 100,000-children method.</div>
<div class="card ex"><span class="lab">Exercise 2: second positive test</span>Assume conditional independence and use the first posterior as the prior. P(D | +, +)? Why does it jump? Would repeated tests always be conditionally independent?</div>
<div class="card ex"><span class="lab">Exercise 3: credit risk (notes §2.5.4)</span>40% of applicants score below 600 (15% default); 60% score ≥ 600 (1% default). P(below 600 | default)? How does it differ from P(default | below 600)? Should every low-score applicant be rejected?</div>
<div class="card ex"><span class="lab">Exercise 4: card-fraud alerts</span>0.5% of transactions are fraudulent. The system flags 90% of frauds and 2% of genuine transactions. A transaction is flagged. P(fraud)?</div>
<div class="card ex"><span class="lab">Exercise 5: AI-essay detector</span>10% of submitted essays are AI-written. The detector flags 85% of AI essays and 5% of human essays. P(AI | flagged)?</div>
<div class="card ex"><span class="lab">Exercise 6: three suppliers (more than two states)</span>Suppliers A, B, C provide 50%, 30%, 20% of parts, with defect rates 1%, 2%, 5%. A part is defective. P(it came from C)?</div>
<div class="card check"><span class="lab">Checkpoint</span>Explain in one sentence why a 95%-sensitive test gives only about a 9% posterior for DMD.</div>`,
ans:`<ul><li><b>1:</b> 0.00095 / (0.00095 + 0.00999) = 0.00095/0.01094 ≈ <b>0.087</b>. Per 100,000: 100 have DMD, 95 test positive; 99,900 healthy, 999 false positives; 95/1,094 ≈ 8.7%.</li>
<li><b>2:</b> Prior 0.087: (0.95 × 0.087) / (0.95 × 0.087 + 0.01 × 0.913) ≈ 0.0826/0.0917 ≈ <b>0.90</b>. It jumps because a healthy child would need to produce a false positive twice (1% × 1%). Not always independent: the same lab error or biological quirk can repeat.</li>
<li><b>3:</b> P(D) = 0.4 × 0.15 + 0.6 × 0.01 = 0.066; P(L | D) = 0.06/0.066 ≈ <b>0.909</b>. P(D | L) = 0.15 answers "how risky is a low-score applicant?"; P(L | D) answers "where do defaults come from?". No blanket rejection: 85% of low-score applicants repay; the decision needs profit per good loan, loss per default, and other applicant information.</li>
<li><b>4:</b> 0.0045 / (0.0045 + 0.995 × 0.02) = 0.0045 / 0.0244 ≈ <b>0.184</b>. Over 80% of alerts are false alarms.</li>
<li><b>5:</b> 0.085 / (0.085 + 0.045) = 0.085/0.13 ≈ <b>0.654</b>. About a third of flagged essays are human-written.</li>
<li><b>6:</b> P(defect) = 0.005 + 0.006 + 0.010 = 0.021; P(C | defect) = 0.010/0.021 ≈ <b>0.476</b>. The smallest supplier causes almost half the defects.</li>
<li><b>Checkpoint:</b> The disease is so rare that false positives from the huge healthy group outnumber true positives from the tiny affected group.</li></ul>`},

/* ---------------- SESSION 8 ---------------- */
{id:8,ch:"Level 3 · Chapter 3: Distributions",title:"Random variables, Bernoulli, Binomial",time:"75–90 min",sec:"Notes §3.1–3.3",
body:`<h3>Intuition</h3>
<p>Chapter 2 asked "will this event happen?". Chapter 3 asks "<b>how many</b> or <b>how much</b>?". A <b>random variable</b> turns an uncertain outcome into a number; its <b>probability distribution</b> lists every possible value and how likely each is.</p>
<div class="tw"><table><tr><th>Outcome type</th><th>Random variable</th><th>Kind</th></tr>
<tr><td>Binary</td><td>Does this loan default? (1/0)</td><td>Discrete</td></tr>
<tr><td>Count</td><td>How many of 50 loans default?</td><td>Discrete</td></tr>
<tr><td>Measurement</td><td>Weekly demand, delivery time</td><td>Continuous</td></tr></table></div>

<h3>Discrete distributions</h3>
<p>A <b>probability mass function (pmf)</b> gives P(X = x) for each value. Every probability is between 0 and 1, and they sum to 1.</p>
<ul><li><b>Mean (expected value):</b> E(X) = μ = Σ x·P(x). The long-run average, not a value you must see.</li>
<li><b>Variance:</b> Var(X) = Σ (x − μ)²·P(x). Average squared distance from the mean.</li>
<li><b>Standard deviation:</b> SD = √Var, in the same units as X. The typical size of a deviation.</li>
<li><b>CDF:</b> F(a) = P(X ≤ a), a running total of the pmf.</li></ul>

<div class="card worked"><span class="lab">Worked example: a project's profit (₹ crore)</span>
<div class="tw"><table><tr><th>Profit x</th><th>P(x)</th><th>x·P(x)</th><th>(x − 3)²·P(x)</th></tr>
<tr><td>10</td><td>0.3</td><td>3.0</td><td>49 × 0.3 = 14.7</td></tr>
<tr><td>2</td><td>0.5</td><td>1.0</td><td>1 × 0.5 = 0.5</td></tr>
<tr><td>−5</td><td>0.2</td><td>−1.0</td><td>64 × 0.2 = 12.8</td></tr>
<tr><td><b>Total</b></td><td>1.0</td><td><b>E = 3</b></td><td><b>Var = 28</b></td></tr></table></div>
SD = √28 ≈ 5.29. The expected profit is ₹3 cr, but no single outcome equals 3, and the spread is large: a 20% chance of losing ₹5 cr. Two projects with the same mean can have very different risk; SD captures that.</div>

<h3>Bernoulli: one yes/no outcome</h3>
<p>X = 1 if the event happens, 0 otherwise, with P(X = 1) = p.</p>
<pre>X ~ Bernoulli(p)     E(X) = p     Var(X) = p(1 − p)</pre>
<p>A loan with a 10% default probability: X ~ Bernoulli(0.10), mean 0.10, variance 0.09. Variance is largest at p = 0.5 (maximum uncertainty) and zero at p = 0 or 1.</p>

<h3>Binomial: counting successes in n trials</h3>
<p>Four conditions, remembered as <b>BINS</b>:</p>
<ul><li><b>B</b>inary: each trial is success/failure.</li>
<li><b>I</b>ndependent trials.</li>
<li><b>N</b>umber of trials fixed in advance.</li>
<li><b>S</b>ame probability p on every trial.</li></ul>
<pre>Y ~ Binomial(n, p)
P(Y = y) = nCy × pʸ × (1 − p)ⁿ⁻ʸ,   y = 0, 1, …, n
E(Y) = np     Var(Y) = np(1 − p)     SD = √(np(1 − p))</pre>
<p><b>Reading the formula:</b> pʸ(1−p)ⁿ⁻ʸ is the probability of one particular arrangement of y successes and n−y failures; nCy counts how many arrangements there are.</p>

<div class="card worked"><span class="lab">Worked example: 5 items, 20% defect rate</span>
Y ~ Binomial(5, 0.2).
<div class="step">P(Y = 0) = 0.8⁵ = 0.32768</div>
<div class="step">P(Y = 1) = 5 × 0.2 × 0.8⁴ = 5 × 0.2 × 0.4096 = 0.4096</div>
<div class="step">P(Y = 2) = 10 × 0.04 × 0.8³ = 10 × 0.04 × 0.512 = 0.2048</div>
<div class="step">P(Y ≤ 1) = 0.32768 + 0.4096 = 0.73728</div>
<div class="step">P(Y ≥ 2) = 1 − 0.73728 = 0.26272 (complement: far quicker than adding P(2) to P(5))</div>
<div class="step">E(Y) = 5 × 0.2 = 1; Var = 5 × 0.2 × 0.8 = 0.8; SD ≈ 0.894</div></div>

<div class="calc" data-calc="binom"></div>

<h3>When the Binomial breaks</h3>
<ul><li><b>n not fixed:</b> "number of calls until the first sale" is not Binomial.</li>
<li><b>p changes:</b> drawing without replacement from a small batch; customers from segments with different churn rates.</li>
<li><b>Not independent:</b> loans in the same industry default together in a downturn; one wrong LLM premise spreads to later claims. Positive dependence makes clustered failures more likely than the Binomial predicts.</li></ul>

<h3>Common mistakes</h3>
<div class="card warn"><ul><li>Forgetting the nCy term.</li>
<li>Computing "at least 1" by summing many terms instead of 1 − P(0).</li>
<li>Misreading "more than 2" as Y ≥ 2.</li>
<li>Interpreting E(Y) = 0.48 errors as "there will be about half an error". It's a long-run average across many briefings.</li></ul></div>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Exercise 1: LLM briefing (notes §3.3.1)</span>12 independent claims, each with a 4% chance of a material error. Y = number of errors. State the distribution, then find (a) P(no errors), (b) P(at least one), (c) E(Y). (d) Respond to "each claim is 96% reliable, so no verification needed". (e) Why might independence fail?</div>
<div class="card ex"><span class="lab">Exercise 2: loan portfolio</span>10 independent loans, each with default probability 0.1. Find P(no defaults), P(at least one), P(exactly 2), E(Y), SD(Y).</div>
<div class="card ex"><span class="lab">Exercise 3: support tickets per hour</span>X takes 0, 1, 2, 3 with probabilities 0.1, 0.3, 0.4, 0.2. Find E(X), Var(X), SD(X).</div>
<div class="card ex"><span class="lab">Exercise 4: Binomial or not?</span><ol>
<li>Number of heads in 20 coin tosses.</li>
<li>Number of sales calls until the first sale.</li>
<li>Number of defectives when 5 parts are drawn without replacement from a box of 10.</li>
<li>Number of 100 customers who churn, where churn probability differs by segment.</li>
<li>Number of 50 independent email recipients who click, each with probability 3%.</li></ol></div>`,
ans:`<h4>Exercise 1</h4><ul><li>Y ~ Binomial(12, 0.04)</li><li>(a) 0.96¹² ≈ <b>0.613</b></li><li>(b) 1 − 0.613 ≈ <b>0.387</b></li><li>(c) 12 × 0.04 = <b>0.48</b></li><li>(d) Per-claim reliability compounds: about 39% of briefings contain at least one material error, so verification is still needed, especially for high-stakes claims.</li><li>(e) One wrong premise can propagate into later claims (positive dependence), and error rates vary by claim type, so p isn't constant either.</li></ul>
<h4>Exercise 2</h4><ul><li>P(0) = 0.9¹⁰ ≈ 0.349</li><li>P(≥ 1) ≈ 0.651</li><li>P(2) = 45 × 0.01 × 0.9⁸ = 45 × 0.01 × 0.4305 ≈ 0.194</li><li>E = 1; SD = √0.9 ≈ 0.949</li></ul>
<h4>Exercise 3</h4><p>E = 0 + 0.3 + 0.8 + 0.6 = <b>1.7</b>. Var = 2.89×0.1 + 0.49×0.3 + 0.09×0.4 + 1.69×0.2 = 0.289 + 0.147 + 0.036 + 0.338 = <b>0.81</b>. SD = <b>0.9</b>.</p>
<h4>Exercise 4</h4><ol><li>Yes</li><li>No: n isn't fixed</li><li>No: p changes after each draw (this is the hypergeometric distribution)</li><li>No: p isn't the same for every customer</li><li>Yes: Binomial(50, 0.03)</li></ol>`},

/* ---------------- SESSION 9 ---------------- */
{id:9,ch:"Level 3 · Chapter 3: Distributions",title:"The Normal distribution",time:"90 min",sec:"Notes §3.4–3.5",
body:`<h3>Continuous variables</h3>
<p>Delivery time can be 31.2 or 31.27 minutes; there is no gap between values. So probability is <b>area under a curve</b> over an interval:</p>
<ul><li>Total area under the curve = 1.</li>
<li>P(X = one exact value) = 0. Only intervals like P(a &lt; X &lt; b) matter, so &lt; and ≤ give the same answer.</li></ul>

<h3>The Normal curve</h3>
<p>Bell-shaped and symmetric around the mean μ. The standard deviation σ controls the spread: small σ gives a tall narrow bell, large σ a flat wide one.</p>
<pre>X ~ N(μ, σ²)      E(X) = μ      SD(X) = σ</pre>
<p>Watch the notation: the second number is the <b>variance</b>. N(500, 100²) has σ = 100.</p>

<h3>The 68–95–99.7 rule</h3>
<div class="tw"><table><tr><th>Range</th><th>Share of observations</th><th>Delivery time N(30, 5²) minutes</th></tr>
<tr><td>μ ± 1σ</td><td>≈ 68%</td><td>25 to 35 min</td></tr>
<tr><td>μ ± 2σ</td><td>≈ 95%</td><td>20 to 40 min</td></tr>
<tr><td>μ ± 3σ</td><td>≈ 99.7%</td><td>15 to 45 min</td></tr></table></div>
<p>A quick sense check: anything more than 3σ from the mean is very unusual.</p>

<h3>Standardising: the Z-score</h3>
<pre>Z = (X − μ) / σ        Z ~ N(0, 1)</pre>
<p>Z says how many standard deviations X is above (positive) or below (negative) the mean. It puts every Normal on the same scale, so one table serves them all.</p>
<div class="card worked"><span class="lab">Worked example: comparing across scales</span>
Aarav scores 78 on an exam with mean 70, SD 5. Meera scores 85 on a different exam with mean 80, SD 10.
<div class="step">Aarav: z = (78 − 70)/5 = 1.6</div>
<div class="step">Meera: z = (85 − 80)/10 = 0.5</div>
Aarav did relatively better, despite the lower raw score.</div>

<h3>Reading the Z table</h3>
<p>Φ(z) = P(Z ≤ z) is the area to the <b>left</b> of z. In Appendix A, find the row for the first decimal (e.g. 1.2) and the column for the second (e.g. .05) to read Φ(1.25) = 0.8944.</p>
<div class="tw"><table><tr><th>You want</th><th>Compute</th><th>Picture</th></tr>
<tr><td>P(Z ≤ z)</td><td>Φ(z), read directly</td><td>left tail</td></tr>
<tr><td>P(Z &gt; z)</td><td>1 − Φ(z)</td><td>right tail</td></tr>
<tr><td>P(a &lt; Z &lt; b)</td><td>Φ(b) − Φ(a)</td><td>middle chunk</td></tr>
<tr><td>Negative z</td><td>Φ(−z) = 1 − Φ(z) (symmetry), or read the negative table</td><td>mirror image</td></tr>
<tr><td>Given a probability, find x</td><td>find z in the table body, then x = μ + zσ</td><td>inverse</td></tr></table></div>
<div class="tw"><table><tr><th>z</th><td>0.00</td><td>1.00</td><td>1.25</td><td>1.28</td><td>1.645</td><td>1.96</td><td>2.00</td></tr><tr><th>Φ(z)</th><td>.5000</td><td>.8413</td><td>.8944</td><td>.8997</td><td>.9500</td><td>.9750</td><td>.9772</td></tr></table></div>

<div class="card worked"><span class="lab">Worked example: delivery times, X ~ N(30, 5²)</span>
<div class="step"><b>P(X ≤ 40):</b> z = (40 − 30)/5 = 2 → Φ(2) = <b>0.9772</b></div>
<div class="step"><b>P(X &gt; 35):</b> z = 1 → 1 − 0.8413 = <b>0.1587</b></div>
<div class="step"><b>P(25 &lt; X &lt; 35):</b> z from −1 to 1 → 0.8413 − 0.1587 = <b>0.6826</b> (the "68%")</div>
<div class="step"><b>P(X &lt; 22):</b> z = −1.6 → table row −1.6, column .00 → <b>0.0548</b></div>
<div class="step"><b>90th percentile:</b> Φ(z) = 0.90 gives z ≈ 1.28 → x = 30 + 1.28 × 5 = <b>36.4 min</b>. 90% of deliveries arrive within 36.4 minutes.</div></div>
<p><b>Always sketch the bell</b> and shade the area you want before touching the table. It prevents most sign errors.</p>

<div class="calc" data-calc="normal"></div>

<div class="card idea"><span class="lab">Level up</span>
<b>Is the data even Normal?</b> Income, claim sizes and ticket resolution times are usually right-skewed (long tail to the right). Using a Normal there understates extreme values. Check a histogram first.<br><br>
<b>Normal approximation to the Binomial:</b> when np ≥ 10 and n(1−p) ≥ 10, Binomial(n, p) is close to N(np, np(1−p)). Useful for large counts, and a bridge to the sampling distributions you'll meet later in the course.</div>

<h3>Common mistakes</h3>
<div class="card warn"><ul><li>Plugging the variance (σ²) in as σ.</li>
<li>Reading Φ(z) when the question asks for the right tail.</li>
<li>Subtracting in the wrong order for a middle interval.</li>
<li>For the inverse problem, looking up the probability in the z column instead of the table body.</li></ul></div>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Drill</span>P(Z &gt; 1.25) = ? &nbsp; Also fill the notes' blanks for the 68–95–99.7 rule.</div>
<div class="card ex"><span class="lab">Exercise 1: inventory (notes §3.5.3)</span>Weekly demand X ~ N(500, 100²). (a) P(stockout) if you stock 600. (b) Stock needed for a 95% service level. (c) Why might a manager choose below 95% for one product and above 99% for another?</div>
<div class="card ex"><span class="lab">Exercise 2: processing time, X ~ N(12, 2²) minutes</span><ol>
<li>P(X &gt; 15)</li><li>P(10 &lt; X &lt; 14)</li><li>P(X &lt; 9)</li><li>The time within which 95% of jobs finish</li></ol></div>
<div class="card ex"><span class="lab">Exercise 3</span>Two sales reps: Riya sold ₹42L in a region with mean ₹35L, SD ₹5L. Kabir sold ₹60L where the mean is ₹50L, SD ₹8L. Who performed better relative to their region?</div>`,
ans:`<ul><li><b>Drill:</b> 1 − 0.8944 = <b>0.1056</b>. Rule: μ ± σ, μ ± 2σ, μ ± 3σ.</li>
<li><b>1a:</b> z = (600 − 500)/100 = 1 → P(stockout) = 1 − 0.8413 = <b>0.1587</b></li>
<li><b>1b:</b> z = 1.645 → 500 + 1.645 × 100 = 664.5, so stock <b>665 units</b> (round up to meet the target)</li>
<li><b>1c:</b> Service level trades off holding cost against stockout cost: cheap, low-margin, easily substituted items justify lower levels; critical, high-margin items or those with slow replenishment or demanding customers justify 99%+.</li>
<li><b>2:</b> (1) z = 1.5 → 1 − 0.9332 = 0.0668 (2) z from −1 to 1 → 0.6826 (3) z = −1.5 → 0.0668 (4) 12 + 1.645 × 2 ≈ 15.29 min</li>
<li><b>3:</b> Riya z = 7/5 = 1.4; Kabir z = 10/8 = 1.25. Riya did relatively better.</li></ul>`},

/* ---------------- SESSION 10 ---------------- */
{id:10,ch:"Level 3 · Chapter 3: Distributions",title:"Choosing a model, and using software",time:"60 min",sec:"Notes §3.6–3.8",
body:`<h3>A model is a choice, not a fact</h3>
<p>Before any calculation, answer four questions:</p>
<ol><li>What is the random variable?</li><li>What values can it take?</li><li>Which distribution is being assumed?</li><li>Are its assumptions defensible for this decision?</li></ol>
<div class="tw"><table><tr><th>Model</th><th>Typical outcome</th><th>Key assumption to question</th></tr>
<tr><td>Bernoulli</td><td>One yes/no outcome</td><td>Is there a meaningful single probability p?</td></tr>
<tr><td>Binomial</td><td>Count of events in n trials</td><td>Fixed n, common p, independent trials?</td></tr>
<tr><td>Normal</td><td>Continuous measurement</td><td>Is a symmetric bell shape reasonable?</td></tr></table></div>

<h3>Software does the arithmetic</h3>
<div class="tw"><table><tr><th>Task</th><th>R</th><th>Python (scipy.stats)</th><th>Excel</th></tr>
<tr><td>Binomial P(Y = y)</td><td><code>dbinom(y, n, p)</code></td><td><code>binom.pmf(y, n, p)</code></td><td><code>=BINOM.DIST(y,n,p,FALSE)</code></td></tr>
<tr><td>Binomial P(Y ≤ y)</td><td><code>pbinom(y, n, p)</code></td><td><code>binom.cdf(y, n, p)</code></td><td><code>=BINOM.DIST(y,n,p,TRUE)</code></td></tr>
<tr><td>Normal P(X ≤ x)</td><td><code>pnorm(x, mu, sigma)</code></td><td><code>norm.cdf(x, mu, sigma)</code></td><td><code>=NORM.DIST(x,mu,sigma,TRUE)</code></td></tr>
<tr><td>Normal quantile</td><td><code>qnorm(q, mu, sigma)</code></td><td><code>norm.ppf(q, mu, sigma)</code></td><td><code>=NORM.INV(q,mu,sigma)</code></td></tr></table></div>
<pre># R: check this chapter's answers
dbinom(0, 12, 0.04)          # 0.6127
1 - pbinom(0, 12, 0.04)      # 0.3873
1 - pnorm(600, 500, 100)     # 0.1587
qnorm(0.95, 500, 100)        # 664.49

# Python
from scipy.stats import binom, norm
binom.pmf(0, 12, 0.04); 1 - norm.cdf(600, 500, 100); norm.ppf(0.95, 500, 100)</pre>
<p><b>Careful with "at least":</b> P(Y ≥ 3) = 1 − P(Y ≤ 2) = <code>1 - pbinom(2, n, p)</code>, not <code>1 - pbinom(3, n, p)</code>.</p>

<h3>From probability to decision</h3>
<p>The course keeps returning to one idea: <b>a probability is an input to a decision, not the decision</b>. The 95% service level, the loan cut-off and the need to verify LLM output all depend on the costs of each kind of mistake, not on the probability alone.</p>

<h3>Practice</h3>
<div class="card ex"><span class="lab">Exercise 1: pick the model</span><ol>
<li>Whether a single customer renews this year.</li>
<li>How many of 40 customers renew, each independently with probability 0.8.</li>
<li>A store's monthly revenue.</li>
<li>Number of calls arriving at a help desk in an hour.</li>
<li>Time to resolve a support ticket.</li></ol></div>
<div class="card ex"><span class="lab">Exercise 2</span>Write the R or Excel expression for P(at least 3 defaults) among 20 loans with p = 0.05.</div>
<div class="card check"><span class="lab">Consolidation</span>Recite the "Things to Remember" lists for all three chapters from memory. Then move to Session 11.</div>`,
ans:`<h4>Exercise 1</h4><ol><li>Bernoulli(p)</li><li>Binomial(40, 0.8)</li><li>Possibly Normal; check for skew and seasonality</li><li>A count, but with no fixed n, so not Binomial (the Poisson distribution, beyond this chapter, fits this)</li><li>Continuous but usually right-skewed, so Normal is questionable</li></ol>
<h4>Exercise 2</h4><p><code>1 - pbinom(2, 20, 0.05)</code> or <code>=1-BINOM.DIST(2,20,0.05,TRUE)</code>, which is about 0.075.</p>`},

/* ---------------- SESSION 11 ---------------- */
{id:11,ch:"Level 4: Exam-ready",title:"Formula sheet and mixed test",time:"90 min",sec:"All chapters",
body:`<h3>Formula sheet</h3>
<div class="tw"><table><tr><th>Topic</th><th>Formula</th></tr>
<tr><td>Proportional allocation</td><td>nₕ = n × Nₕ / N</td></tr>
<tr><td>Complement</td><td>P(Aᶜ) = 1 − P(A)</td></tr>
<tr><td>Addition rule</td><td>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</td></tr>
<tr><td>Conditional</td><td>P(A | B) = P(A ∩ B) / P(B)</td></tr>
<tr><td>Multiplication</td><td>P(A ∩ B) = P(A | B) P(B)</td></tr>
<tr><td>Chain rule</td><td>P(A ∩ B ∩ C) = P(A) P(B | A) P(C | A ∩ B)</td></tr>
<tr><td>Independence</td><td>P(A | B) = P(A) ⇔ P(A ∩ B) = P(A)P(B)</td></tr>
<tr><td>Total probability</td><td>P(A) = P(A | B)P(B) + P(A | Bᶜ)P(Bᶜ)</td></tr>
<tr><td>Bayes</td><td>P(B | A) = P(A | B)P(B) / P(A)</td></tr>
<tr><td>Expected value</td><td>E(X) = Σ x P(x)</td></tr>
<tr><td>Variance</td><td>Var(X) = Σ (x − μ)² P(x); SD = √Var</td></tr>
<tr><td>Bernoulli(p)</td><td>mean p, variance p(1 − p)</td></tr>
<tr><td>Binomial(n, p)</td><td>P(Y = y) = nCy pʸ(1 − p)ⁿ⁻ʸ; mean np; variance np(1 − p)</td></tr>
<tr><td>Standardise</td><td>Z = (X − μ)/σ; inverse x = μ + zσ</td></tr>
<tr><td>Key z values</td><td>1.28 → 90%, 1.645 → 95%, 1.96 → 97.5% (one-sided)</td></tr></table></div>

<h3>Glossary in one line each</h3>
<div class="tw"><table>
<tr><td>Target population</td><td>everyone the question is about</td></tr>
<tr><td>Study population</td><td>the part you can actually sample from</td></tr>
<tr><td>Sample / n</td><td>units that actually provided data / how many</td></tr>
<tr><td>Parameter / statistic</td><td>population summary (unknown) / sample summary (known)</td></tr>
<tr><td>Cluster / stratum</td><td>mini-population copy / homogeneous slice</td></tr>
<tr><td>Prior / likelihood / posterior</td><td>before evidence / fit of evidence to hypothesis / after evidence</td></tr>
<tr><td>pmf / cdf</td><td>P(X = x) / P(X ≤ x)</td></tr>
<tr><td>Φ(z)</td><td>area left of z under the standard Normal</td></tr></table></div>

<h3>Mixed test (no notes, 60 minutes)</h3>
<div class="card ex"><ol>
<li>A company has three regions with 5,000, 3,000 and 2,000 employees. Allocate a stratified sample of 50 proportionally.</li>
<li>A university estimates how often all its students exercise by surveying students leaving the gym. Name the target population and the bias.</li>
<li>P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.2. Are A and B independent? Find P(A ∪ B) and P(A | B).</li>
<li>4% of items are defective. An inspector flags 90% of defective items and 6% of good ones. An item is flagged. P(defective)?</li>
<li>A fair coin is tossed 8 times. P(all heads)? P(at least 7 heads)?</li>
<li>Call handling time is N(6, 1.5²) minutes. P(a call exceeds 9 minutes)?</li>
<li>Delivery time is N(4, 0.5²) days. What delivery promise can be met 97.5% of the time?</li>
<li>A manager says: "Our 18 independent controls each fail only 2% of the time, so a failure somewhere is unlikely." Compute P(at least one fails) and respond.</li></ol></div>`,
ans:`<ol><li>25, 15, 10</li>
<li>Target: all students of the university. Sampling bias (convenience / under-coverage): gym-goers exercise more than average, so the estimate is too high.</li>
<li>0.5 × 0.4 = 0.2 = P(A ∩ B), so <b>independent</b>. P(A ∪ B) = 0.7. P(A | B) = 0.2/0.4 = 0.5 = P(A), consistent.</li>
<li>0.036 / (0.036 + 0.96 × 0.06) = 0.036/0.0936 ≈ <b>0.385</b></li>
<li>(½)⁸ = 1/256 ≈ 0.0039. P(≥ 7) = (8 + 1)/256 = 9/256 ≈ <b>0.035</b></li>
<li>z = (9 − 6)/1.5 = 2 → 1 − 0.9772 = <b>0.0228</b></li>
<li>4 + 1.96 × 0.5 = 4.98, so promise <b>5 days</b></li>
<li>1 − 0.98¹⁸ ≈ 1 − 0.695 = <b>0.305</b>. Nearly a one-in-three chance of at least one failure: small per-item risks accumulate (the same lesson as the LLM briefing). And if controls share a common cause, they're not independent either.</li></ol>`}
];

/* ---------- calculators ---------- */
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);
const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
function invPhi(p){let lo=-8,hi=8;for(let i=0;i<100;i++){const m=(lo+hi)/2;Phi(m)<p?lo=m:hi=m}return(lo+hi)/2}
const f=(x,d=4)=>isFinite(x)?(+x).toFixed(d):"–";
function field(id,label,val,step){return '<label for="'+id+'">'+label+'<input id="'+id+'" type="number" value="'+val+'" step="'+(step||"any")+'"></label>'}
const CALC={
bayes:{html:'<span class="lab">Try it: Bayes calculator</span><p style="margin:0;font-size:15px">Change the inputs and watch how strongly the base rate drives the answer.</p><div class="row">'+field("bp","Prior P(B)",0.001)+field("bs","P(evidence | B)",0.95)+field("bf","P(evidence | not B)",0.01)+'</div><output id="bo"></output>',
run(){const p=+bp.value,s=+bs.value,fa=+bf.value;const tp=p*s,fp=(1-p)*fa,post=tp/(tp+fp);
bo.innerHTML="Per 100,000 cases: "+Math.round(tp*1e5).toLocaleString()+" true alarms, "+Math.round(fp*1e5).toLocaleString()+" false alarms<br>Posterior P(B | evidence) = <b>"+f(post)+"</b>"},ids:["bp","bs","bf"]},
binom:{html:'<span class="lab">Try it: Binomial calculator</span><div class="row">'+field("bn","n (trials)",12,1)+field("bpp","p (success prob.)",0.04)+field("by","y",0,1)+'</div><output id="bno"></output>',
run(){const n=Math.max(0,Math.floor(+bn.value)),p=Math.min(1,Math.max(0,+bpp.value)),y=Math.floor(+by.value);
if(n>1000){bno.textContent="Keep n at 1,000 or below.";return}
const pm=[];let v=Math.pow(1-p,n);for(let k=0;k<=n;k++){pm.push(v);v=(p>=1)?(k+1===n?1:0):v*(n-k)/(k+1)*p/(1-p)}
if(p>=1){pm.fill(0);pm[n]=1}
let le=0;for(let k=0;k<=Math.min(y,n);k++)le+=pm[k];const eq=(y>=0&&y<=n)?pm[y]:0;
bno.innerHTML="P(Y = "+y+") = <b>"+f(eq)+"</b> &nbsp; P(Y ≤ "+y+") = <b>"+f(le)+"</b> &nbsp; P(Y ≥ "+y+") = <b>"+f(1-le+eq)+"</b><br>Mean np = "+f(n*p,3)+" &nbsp; SD = "+f(Math.sqrt(n*p*(1-p)),3)},ids:["bn","bpp","by"]},
normal:{html:'<span class="lab">Try it: Normal calculator</span><div class="row">'+field("nm","Mean μ",500)+field("ns","SD σ",100)+field("nx","Value x",600)+field("nq","Probability q (inverse)",0.95)+'</div><output id="no"></output>',
run(){const m=+nm.value,s=+ns.value,x=+nx.value,q=+nq.value;if(s<=0){no.textContent="σ must be positive.";return}
const z=(x-m)/s,P=Phi(z);let inv="";if(q>0&&q<1){const zq=invPhi(q);inv="<br>x with P(X ≤ x) = "+q+": z = "+f(zq,3)+", x = μ + zσ = <b>"+f(m+zq*s,2)+"</b>"}
no.innerHTML="z = ("+x+" − "+m+") / "+s+" = <b>"+f(z,2)+"</b><br>P(X ≤ x) = <b>"+f(P)+"</b> &nbsp; P(X &gt; x) = <b>"+f(1-P)+"</b>"+inv},ids:["nm","ns","nx","nq"]}};
function initCalcs(){document.querySelectorAll(".calc").forEach(el=>{const c=CALC[el.dataset.calc];if(!c)return;el.innerHTML=c.html;c.run();c.ids.forEach(id=>document.getElementById(id).addEventListener("input",()=>c.run()))})}

/* ---------- app ---------- */
const KEY="samd-progress-v1";
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
const nav=document.getElementById("nav"),main=document.getElementById("main");
let cur=0;
function renderNav(){let h="",last="";
for(const s of S){if(s.ch!==last){h+='<div class="chap">'+s.ch+'</div>';last=s.ch}
h+='<button data-i="'+s.id+'" class="'+(done[s.id]?"done":"")+'" '+(s.id===cur?'aria-current="true"':"")+'><span class="n">'+(done[s.id]?"✓":s.id)+'</span><span class="t">'+s.title+'</span></button>'}
nav.innerHTML=h;
const n=S.filter(s=>done[s.id]).length;
document.getElementById("pbi").style.width=(n/S.length*100)+"%";
document.getElementById("pb").setAttribute("aria-valuenow",Math.round(n/S.length*100));
document.getElementById("pct").textContent=n+" of "+S.length+" sessions done"}
function show(i){cur=i;const s=S[i];
main.innerHTML='<p class="crumb">'+s.ch+'</p><h2>Session '+s.id+': '+s.title+'</h2><p class="meta">'+s.time+' · '+s.sec+'</p>'+s.body+
'<details><summary>Answer key (attempt everything first)</summary>'+s.ans+'</details><div class="actions">'+
(i>0?'<button class="btn" id="prev">Previous</button>':"")+
'<button class="btn primary" id="mark">'+(done[i]?"Mark as not done":"Mark session done")+'</button>'+
(i<S.length-1?'<button class="btn" id="next">Next session</button>':"")+'</div>';
document.title="Session "+s.id+": "+s.title+" · SAMD";
renderNav();initCalcs();
document.getElementById("mark").onclick=()=>{done[i]=!done[i];save();show(i)};
const p=document.getElementById("prev"),nx=document.getElementById("next");
if(p)p.onclick=()=>go(i-1);if(nx)nx.onclick=()=>go(i+1)}
function go(i){location.hash="s"+i}
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b){go(+b.dataset.i);nav.classList.remove("open")}});
window.addEventListener("hashchange",()=>{const m=location.hash.match(/s(\d+)/);show(m&&S[+m[1]]?+m[1]:0);main.focus();window.scrollTo(0,0)});
document.getElementById("menuBtn").onclick=e=>{const o=nav.classList.toggle("open");e.target.setAttribute("aria-expanded",o)};
document.getElementById("reset").onclick=()=>{if(confirm("Clear all progress?")){done={};save();show(cur)}};
document.getElementById("theme").onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0f1622";r.dataset.theme=dark?"light":"dark"};
const m0=location.hash.match(/s(\d+)/);show(m0&&S[+m0[1]]?+m0[1]:0);
</script>
</body>
</html>
